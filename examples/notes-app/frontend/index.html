<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>Jolt Notes (React + TypeScript)</title>
  <script>
    // Runs before the first paint: use the theme Java remembered, so there is no flash of the wrong one. For "system"
    // the CSS media query in styles.css already does the right thing.
    (function () {
      var p = window.__JOLT_PREFERENCE__;
      if (p === 'light' || p === 'dark') document.documentElement.dataset.theme = p;
    })();
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
