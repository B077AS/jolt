<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Jolt Notes</title>
<script>
  // Runs before the first paint: use the theme Java remembered, so there is no flash of the wrong one. For "system"
  // the CSS media query above already does the right thing.
  (function () {
    var p = window.__JOLT_PREFERENCE__;
    if (p === "light" || p === "dark") document.documentElement.dataset.theme = p;
  })();
</script>
<style>
  /* Two themes. The same two background and text colours are repeated in THEMES below, because Java needs them to
     colour the native title bar to match the page. */
  :root {
    --bg: #fbf7f4; --surface: #ffffff; --ink: #221b18; --muted: #7b6f69; --line: #eadfd8;
    --accent-a: #f2381f; --accent-b: #ff8a0f; --danger: #b4232c; --ring: rgba(242, 56, 31, .28);
    --shadow: 0 1px 2px rgba(70, 30, 10, .06), 0 8px 24px -12px rgba(70, 30, 10, .16);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
    --bg: #15110f; --surface: #1e1917; --ink: #f4ede8; --muted: #a79a93; --line: #342b27;
    --danger: #ff7b7b; --ring: rgba(255, 110, 60, .4);
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 8px 24px -12px rgba(0, 0, 0, .65);
    }
    :root:not([data-theme="light"]) { color-scheme: dark; }
  }
  :root[data-theme="dark"] {
    --bg: #15110f; --surface: #1e1917; --ink: #f4ede8; --muted: #a79a93; --line: #342b27;
    --danger: #ff7b7b; --ring: rgba(255, 110, 60, .4);
    --shadow: 0 1px 2px rgba(0, 0, 0, .45), 0 8px 24px -12px rgba(0, 0, 0, .65);
  }
  * { box-sizing: border-box; }
  html { color-scheme: light; }
  html[data-theme="dark"] { color-scheme: dark; }
  [hidden] { display: none !important; } /* author display rules below would otherwise override the hidden attribute */
  body {
    margin: 0; min-height: 100vh; background: var(--bg); color: var(--ink);
    font: 15px/1.5 "Segoe UI Variable Text", "Segoe UI", system-ui, -apple-system, "Helvetica Neue", sans-serif;
    -webkit-font-smoothing: antialiased;
    background-image: radial-gradient(900px 380px at 50% -140px, color-mix(in srgb, var(--accent-a) 16%, transparent), transparent);
    background-repeat: no-repeat;
  }
  header {
    position: sticky; top: 0; z-index: 2; display: flex; align-items: center; gap: 12px; padding: 14px 20px;
    background: color-mix(in srgb, var(--bg) 82%, transparent); backdrop-filter: blur(14px);
    border-bottom: 1px solid var(--line);
  }
  .logo { flex: none; overflow: visible; stroke: none; width: 36px; height: 36px; filter: drop-shadow(0 6px 10px color-mix(in srgb, var(--accent-a) 38%, transparent)); }
  h1 { margin: 0; font-size: 18px; font-weight: 650; letter-spacing: -.01em; }
  .count {
    padding: 1px 9px; border-radius: 999px; background: var(--surface); border: 1px solid var(--line);
    color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums;
  }
  .spacer { flex: 1; }
  .theme { display: inline-flex; padding: 3px; gap: 2px; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; }
  .theme button {
    display: grid; place-items: center; width: 30px; height: 26px; padding: 0; border: 0; border-radius: 7px;
    background: transparent; color: var(--muted); cursor: pointer; transition: background .15s, color .15s;
  }
  .theme button:hover { color: var(--ink); }
  .theme button[aria-pressed="true"] { background: var(--bg); color: var(--ink); box-shadow: inset 0 0 0 1px var(--line); }
  svg { display: block; width: 16px; height: 16px; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  main { max-width: 600px; margin: 0 auto; padding: 22px 20px 70px; }
  form {
    display: flex; gap: 8px; padding: 8px; background: var(--surface); border: 1px solid var(--line);
    border-radius: 14px; box-shadow: var(--shadow); transition: box-shadow .15s, border-color .15s;
  }
  form:focus-within { border-color: var(--accent-a); box-shadow: 0 0 0 4px var(--ring); }
  input {
    flex: 1; min-width: 0; padding: 9px 10px; font: inherit; color: inherit; background: transparent; border: 0; outline: none;
  }
  input::placeholder { color: var(--muted); }
  .add {
    display: inline-flex; align-items: center; gap: 6px; padding: 0 14px; font: inherit; font-weight: 600; color: #fff; border: 0;
    border-radius: 10px; cursor: pointer; background: linear-gradient(135deg, var(--accent-a), var(--accent-b));
    transition: transform .1s, filter .15s;
  }
  .add:hover { filter: brightness(1.08); }
  .add:active { transform: scale(.97); }
  #error { margin: 12px 4px 0; color: var(--danger); font-size: 13px; }
  #error:empty { display: none; }
  ul { list-style: none; margin: 16px 0 0; padding: 0; display: grid; gap: 10px; }
  li {
    display: flex; align-items: flex-start; gap: 12px; padding: 14px 14px 14px 16px; background: var(--surface);
    border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow);
    animation: in .28s cubic-bezier(.2, .8, .2, 1) both; transition: transform .15s, border-color .15s;
  }
  li:hover { border-color: color-mix(in srgb, var(--accent-a) 40%, var(--line)); }
  li.leaving { animation: out .16s ease-in forwards; }
  .body { flex: 1; min-width: 0; }
  .text { overflow-wrap: anywhere; white-space: pre-wrap; }
  .when { margin-top: 2px; color: var(--muted); font-size: 12px; }
  .del {
    display: grid; place-items: center; width: 30px; height: 30px; padding: 0; border: 0; border-radius: 8px; color: var(--muted);
    background: transparent; cursor: pointer; opacity: 0; transition: opacity .15s, background .15s, color .15s;
  }
  li:hover .del, .del:focus-visible { opacity: 1; }
  .del:hover { color: var(--danger); background: color-mix(in srgb, var(--danger) 12%, transparent); }
  .empty { display: grid; justify-items: center; gap: 6px; padding: 54px 20px; color: var(--muted); text-align: center; }
  .empty svg.art { width: 84px; height: 84px; stroke-width: 1.4; color: var(--accent-a); opacity: .85; }
  .empty strong { color: var(--ink); font-size: 16px; }
  footer {
    position: fixed; left: 0; right: 0; bottom: 0; padding: 8px 20px; color: var(--muted); font-size: 12px; text-align: center;
    background: color-mix(in srgb, var(--bg) 85%, transparent); backdrop-filter: blur(10px); border-top: 1px solid var(--line);
  }
  button:focus-visible, .theme button:focus-visible { outline: 2px solid var(--accent-a); outline-offset: 2px; }
  @keyframes in { from { opacity: 0; transform: translateY(8px) scale(.985); } to { opacity: 1; transform: none; } }
  @keyframes out { to { opacity: 0; transform: translateX(14px) scale(.98); } }
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } }
</style>
</head>
<body>
<header>
  <!-- The Jolt icon: the same shapes as the window icon (icon.ico). -->
  <svg class="logo" viewBox="0 0 256 256" aria-hidden="true">
    <defs><linearGradient id="logo-tile" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F2381F"/><stop offset="1" stop-color="#FF8A0F"/></linearGradient></defs>
    <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#logo-tile)"/>
    <path d="M105.0 62.0 H197.0 M180.0 62.0 L180.0 100.0 L152.0 126.0 L152.0 156.0 A38.0 38.0 0 0 1 76.0 156.0" fill="none" stroke="#fff" stroke-width="34" stroke-linejoin="miter" stroke-miterlimit="4"/>
  </svg>
  <h1>Notes</h1>
  <span class="count" id="count" hidden></span>
  <span class="spacer"></span>
  <div class="theme" role="group" aria-label="Theme">
    <button data-pref="system" aria-pressed="false" title="Match the system" aria-label="System theme">
      <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="12" rx="2"/><path d="M8 20h8M12 16v4"/></svg></button>
    <button data-pref="light" aria-pressed="false" title="Light" aria-label="Light theme">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg></button>
    <button data-pref="dark" aria-pressed="false" title="Dark" aria-label="Dark theme">
      <svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  </div>
</header>

<main>
  <form id="add">
    <input id="text" placeholder="Write a note, then press Enter" autocomplete="off" autofocus aria-label="New note">
    <button class="add"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>Add</button>
  </form>
  <div id="error" role="alert"></div>
  <ul id="notes"></ul>
  <div class="empty" id="empty" hidden>
    <svg class="art" viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="3"/><path d="M8 8h8M8 12h8M8 16h4"/></svg>
    <strong>No notes yet</strong>
    <span>Type something above and press Enter.</span>
  </div>
</main>
<footer id="status">Starting...</footer>

<script>
  // ---- the bridge: turn Jolt's string messages into promises -------------------------------------------------------
  // window.jolt.postMessage(text) sends to Java; window.jolt.onMessage(callback) receives from Java.
  const pending = new Map();
  let nextId = 1;

  window.jolt.onMessage((text) => {
    const reply = JSON.parse(text);
    const waiter = pending.get(reply.id);
    if (!waiter) return;
    pending.delete(reply.id);
    if (reply.error) waiter.reject(new Error(reply.error));
    else waiter.resolve(reply.result);
  });

  function call(method, params = {}) {
    return new Promise((resolve, reject) => {
      const id = nextId++;
      pending.set(id, { resolve, reject });
      window.jolt.postMessage(JSON.stringify({ id, method, params }));
    });
  }

  // ---- theme: the page decides, Java restyles the native title bar to match ----------------------------------------
  const THEMES = {                       // keep in sync with the CSS variables above
    light: { bg: '#fbf7f4', text: '#221b18' },
    dark:  { bg: '#15110f', text: '#f4ede8' },
  };
  const systemDark = window.matchMedia('(prefers-color-scheme: dark)');
  let preference = 'system';

  function applyTheme() {
    const scheme = preference === 'system' ? (systemDark.matches ? 'dark' : 'light') : preference;
    document.documentElement.dataset.theme = scheme;
    document.querySelectorAll('.theme button').forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.pref === preference)));
    const colors = THEMES[scheme];
    return call('window.setTheme', { preference, scheme, background: colors.bg, text: colors.text });
  }

  document.querySelectorAll('.theme button').forEach((b) => {
    b.onclick = () => { preference = b.dataset.pref; run(applyTheme); };
  });
  systemDark.addEventListener('change', () => { if (preference === 'system') run(applyTheme); });

  // ---- the application ---------------------------------------------------------------------------------------------
  const $ = (id) => document.getElementById(id);
  const relative = new Intl.RelativeTimeFormat(undefined, { numeric: 'auto' });

  function ago(ms) {
    const seconds = Math.round((ms - Date.now()) / 1000);
    for (const [unit, size] of [['day', 86400], ['hour', 3600], ['minute', 60]]) {
      if (Math.abs(seconds) >= size) return relative.format(Math.round(seconds / size), unit);
    }
    return 'just now';
  }

  async function refresh() {
    const notes = (await call('notes.list')).sort((a, b) => b.createdAt - a.createdAt);
    $('notes').replaceChildren(...notes.map((note) => {
      const item = document.createElement('li');
      const body = document.createElement('div');
      body.className = 'body';
      const text = document.createElement('div');
      text.className = 'text';
      text.textContent = note.text;                       // textContent, never innerHTML: notes are user data
      const when = document.createElement('div');
      when.className = 'when';
      when.textContent = ago(note.createdAt);
      when.title = new Date(note.createdAt).toLocaleString();
      body.append(text, when);
      const remove = document.createElement('button');
      remove.className = 'del';
      remove.title = 'Delete';
      remove.setAttribute('aria-label', 'Delete note');
      remove.innerHTML = '<svg viewBox="0 0 24 24"><path d="M3 6h18M8 6V4h8v2M6 6l1 14h10l1-14M10 11v5M14 11v5"/></svg>';
      remove.onclick = () => run(async () => {
        item.classList.add('leaving');
        await new Promise((r) => setTimeout(r, 150));
        await call('notes.delete', { id: note.id });
        await refresh();
      });
      item.append(body, remove);
      return item;
    }));
    $('empty').hidden = notes.length > 0;
    $('count').hidden = notes.length === 0;
    $('count').textContent = notes.length;
  }

  async function run(action) {
    $('error').textContent = '';
    try { await action(); } catch (e) { $('error').textContent = e.message; }
  }

  $('add').onsubmit = (event) => {
    event.preventDefault();
    run(async () => {
      await call('notes.add', { text: $('text').value });
      $('text').value = '';
      await refresh();
    });
  };

  async function start() {
    preference = (await call('settings.get')).preference;
    await applyTheme();
    const info = await call('app.info');
    $('status').textContent = `Plain HTML and CSS, running on ${info.os} with Java ${info.java}`;
    await refresh();
    if (window.__SMOKE__) await smoke();
  }

  // Used by `--smoke`: exercises every request, then tells Java the verdict.
  async function smoke() {
    try {
      const before = (await call('notes.list')).length;
      const added = await call('notes.add', { text: 'smoke note ✓' });
      if ((await call('notes.list')).length !== before + 1) throw new Error('add did not grow the list');
      await call('notes.delete', { id: added.id });
      if ((await call('notes.list')).length !== before) throw new Error('delete did not shrink the list');
      await expectRejected(() => call('notes.add', { text: '   ' }), 'an empty note should be rejected');
      await expectRejected(() => call('no.such.method'), 'an unknown method should be rejected');
      await call('window.setTheme', { preference: 'dark', scheme: 'dark', background: '#15110f', text: '#f4ede8' });
      if ((await call('settings.get')).preference !== 'dark') throw new Error('the theme was not remembered');
      await expectRejected(() => call('window.setTheme', { preference: 'dark', scheme: 'dark', background: 'red', text: '#fff' }),
        'a bad colour should be rejected');
      window.jolt.postMessage(JSON.stringify({ smoke: 'ok' }));
    } catch (e) {
      window.jolt.postMessage(JSON.stringify({ smoke: 'fail', error: String(e) }));
    }
  }

  async function expectRejected(action, message) {
    try { await action(); } catch (e) { return; }
    throw new Error(message);
  }

  start().catch((e) => { $('error').textContent = e.message; });
</script>
</body>
</html>
