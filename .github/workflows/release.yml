name: Release
# Publishing a GitHub release (tag 0.1.0 or v0.1.0) publishes that version to Maven Central.
on:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java and Apache Maven
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'
          server-id: central
          server-username: MAVEN_USERNAME
          server-password: MAVEN_CENTRAL_TOKEN
          gpg-private-key: ${{ secrets.GPG_PRIVATE_KEY }}
          gpg-passphrase: MAVEN_GPG_PASSPHRASE

      - name: Set release version from the tag
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: mvn -B -ntp versions:set -DnewVersion="${TAG#v}" -DgenerateBackupPoms=false

      # The backend tests open real windows, so they are skipped here. Examples are not published.
      - name: Publish to Maven Central
        run: >
          mvn -B -ntp clean deploy -Prelease -DskipTests
          -pl jolt-core,jolt-win32,jolt-linux -am
        env:
          MAVEN_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          MAVEN_CENTRAL_TOKEN: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
